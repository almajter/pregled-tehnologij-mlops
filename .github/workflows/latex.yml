---
name: Build LaTeX PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: thesis/main.tex
          work_in_root_file_dir: true
          # Match the local build (make pdf / the compile-check hook) so "it built
          # in CI" and "it built locally" mean the same thing.
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis/build/main.pdf

  # GitHub is the origin; the self-hosted GitLab (gitlab.alters.si) is a mirror
  mirror:
    name: Mirror to GitLab
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to gitlab.alters.si
        run: |
          git push --force \
            "https://oauth2:${{ secrets.GITLAB_MIRROR_TOKEN }}@gitlab.alters.si/majal/pregled-tehnologij-mlops.git" \
            HEAD:refs/heads/main

