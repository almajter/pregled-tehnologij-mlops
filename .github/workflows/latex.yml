---
name: Build LaTeX PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: thesis/main.tex
          work_in_root_file_dir: true
          # Match the local build (make pdf / the compile-check hook) so "it built
          # in CI" and "it built locally" mean the same thing.
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis/build/main.pdf

