# GitHub is the origin; .github/workflows/ci.yml mirrors main here. This
# file lints, builds the api image on runner-01 (docker socket), pushes it to
# registry.alters.si and deploys it to forecast-01 (10.0.10.20) — same shape
# as the alters.si pipeline.

stages: [check, build, deploy, verify]

lint:
  stage: check
  image: ghcr.io/astral-sh/uv:0.7.8-python3.12-bookworm-slim
  script:
    - cd project
    - uv run --only-group dev ruff check .
    - uv run --only-group dev ruff format --check .

build:
  stage: build
  image: docker:28
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # --provenance=false: GitLab's registry 500s on BuildKit's attestation manifest
    # --platform: forecast-01 is amd64; matters when the job runs from an arm64 laptop
    - docker build --provenance=false --platform linux/amd64 -f project/docker/api/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" project
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# forecast-01 accepts exactly one command from this key (forced command in
# authorized_keys): "<tag>". Secrets travel over stdin, one per line (registry
# user + job token, ENTSO-E token, MLflow URI), and end up only in the
# container's environment — nothing is written on the host.
# ENTSOE_API_TOKEN is a masked CI variable.
deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    MLFLOW_TRACKING_URI: http://10.0.10.19:5001
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -m 700 ~/.ssh
    - echo "$FORECAST01_HOST_KEY" > ~/.ssh/known_hosts
    # GitLab's variable form strips the trailing newline; OpenSSH then refuses the key ("error in libcrypto")
    - printf '%s\n' "$(cat "$DEPLOY_SSH_KEY")" > ~/.ssh/key
    - chmod 600 ~/.ssh/key
  script:
    - printf '%s\n' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" "$ENTSOE_API_TOKEN" "$MLFLOW_TRACKING_URI" | ssh -i ~/.ssh/key deploy@10.0.10.20 "$CI_COMMIT_SHORT_SHA"

verify:
  stage: verify
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl
    - curl -sf http://10.0.10.20:8000/health
