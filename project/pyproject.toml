[project]
name = "price-forecaster"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the Slovenian bidding zone (SI)"
readme = "README.md"
authors = [
    { name = "Maj Alter", email = "majalter1@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "entsoe-py>=0.6,<0.7",
    "fastapi<1",
    "holidays>=0.103",
    "lightgbm>=4,<5",
    "mlflow>=3,<4",
    "pandas>=2,<3",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.7,<2",
    "uvicorn<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
