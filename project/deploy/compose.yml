services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:?set in deploy/.env}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:?set in deploy/.env}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
