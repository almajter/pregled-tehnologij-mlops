apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/almajter/pregled-tehnologij-mlops.git
    targetRevision: HEAD
    path: project/applications/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
