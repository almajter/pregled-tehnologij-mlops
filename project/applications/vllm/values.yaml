servingEngineSpec:
  strategy:
    type: Recreate
  modelSpec:
    - name: qwen
      repository: vllm/vllm-openai
      tag: v0.31.0
      modelURL: Qwen/Qwen2.5-0.5B-Instruct
      requestCPU: 2
      requestMemory: 8Gi
      requestGPU: 1
      pvcStorage: 10Gi
      env:
        - name: HOME
          value: /data
routerSpec:
  enableRouter: false
