servingEngineSpec:
  strategy:
    type: Recreate
  vllmApiKey:
    secretName: vllm-api-key
    secretKey: VLLM_API_KEY
  modelSpec:
    - name: qwen
      repository: vllm/vllm-openai
      tag: v0.31.0
      modelURL: Qwen/Qwen2.5-0.5B-Instruct
      modelRevision: 7ae557604adf67be50417f59c2c2f167def9a775
      requestCPU: 2
      requestMemory: 8Gi
      requestGPU: 1
      pvcStorage: 10Gi
      initContainer:
        name: adapter
        image: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie-slim
        command: ["sh", "-c"]
        args:
          - rm -rf /data/loras && uvx --from mlflow-skinny==3.16.0 mlflow artifacts download --run-id ce61ee02ac0a4deea41499a7eacd5443 --artifact-path adapter --dst-path /data/loras
        env:
          - name: MLFLOW_TRACKING_URI
            value: https://mlflow.apps.okd.alters.si
          - name: HOME
            value: /tmp
        mountPvcStorage: true
      vllmConfig:
        gpuMemoryUtilization: 0.25
        extraArgs:
          - --enable-lora
          - --lora-modules
          - socratic=/data/loras/adapter
      env:
        - name: HOME
          value: /data
routerSpec:
  enableRouter: false
extraObjects:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: vllm
      namespace: model-serving
    spec:
      host: vllm.apps.okd.alters.si
      port:
        targetPort: service-port
      tls:
        termination: edge
      to:
        kind: Service
        name: vllm-qwen-engine-service
