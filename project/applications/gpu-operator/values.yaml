platform:
  openshift: true
driver:
  repository: image-registry.openshift-image-registry.svc:5000/nvidia-gpu-operator
  version: "595.91.07"
validator:
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: system:openshift:scc:hostmount-anyuid-v2
      namespace: nvidia-gpu-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:openshift:scc:hostmount-anyuid-v2
    subjects:
      - kind: ServiceAccount
        name: node-feature-discovery
        namespace: nvidia-gpu-operator
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: driver
      namespace: nvidia-gpu-operator
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: driver
      namespace: nvidia-gpu-operator
    spec:
      source:
        dockerfile: |
          FROM nvcr.io/nvidia/driver@sha256:52b984c00817b08dcf5a0ed50dbba7b9f4d779614bde486a3483a4fb61dea3e5
          RUN dnf install -y \
              https://kojihub.stream.centos.org/kojifiles/packages/kernel/6.12.0/254.el10/x86_64/kernel-devel-6.12.0-254.el10.x86_64.rpm \
              https://kojihub.stream.centos.org/kojifiles/packages/kernel/6.12.0/254.el10/x86_64/kernel-headers-6.12.0-254.el10.x86_64.rpm \
           && dnf clean all
      strategy:
        dockerStrategy: {}
      output:
        to:
          kind: ImageStreamTag
          name: driver:595.91.07-centos10
      triggers:
        - type: ConfigChange
