platform:
  openshift: true
driver:
  repository: ghcr.io/almajter
  version: "595.91.07"
  upgradePolicy:
    autoUpgrade: false
validator:
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: system:openshift:scc:hostmount-anyuid-v2
      namespace: nvidia-gpu-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:openshift:scc:hostmount-anyuid-v2
    subjects:
      - kind: ServiceAccount
        name: node-feature-discovery
        namespace: nvidia-gpu-operator
