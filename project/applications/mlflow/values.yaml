podSecurityContext:
  fsGroup: null
securityContext:
  runAsUser: null
backendStore:
  postgres:
    enabled: true
    host: postgresql-cluster-rw
    database: app
  existingDatabaseSecret:
    name: postgresql-cluster-app
ingress:
  enabled: true
  className: openshift-default
  hosts:
    - host: mlflow.apps.okd.alters.si
      paths:
        - path: /
          pathType: Prefix
  tls:
    - {}
